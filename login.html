<!DOCTYPE html>

<html class="light" lang="id">

<head>
    <script>
        if (localStorage.getItem('admin_token')) {
            window.location.href = "logs.html";
        }
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - InstaADB Panel</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#dae2fd",
                        "secondary-fixed-dim": "#68dba9",
                        "on-tertiary-fixed-variant": "#920028",
                        "primary-fixed-dim": "#c3c0ff",

                        "on-primary": "#ffffff",

                        "on-error-container": "#93000a",
                        "secondary-container": "#82f5c1",
                        "inverse-on-surface": "#eef0ff",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3323cc",
                        "primary-fixed": "#e2dfff",
                        "tertiary-fixed": "#ffdada",
                        "on-tertiary-fixed": "#40000c",
                        "on-error": "#ffffff",
                        "surface-tint": "#4d44e3",
                        "surface-dim": "#d2d9f4",
                        "on-primary-fixed": "#0f0069",
                        "secondary-fixed": "#85f8c4",

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Slate-50 fallback */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .login-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-stack-md bg-slate-50">
    <!-- Background Subtle Texture -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03]"
        style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
    <main class="w-full max-w-[420px] relative z-10">
        <!-- Brand Identity -->
        <div class="text-center mb-stack-lg">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl text-white mb-stack-md shadow-sm"
                style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-8 h-8" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                </svg>
            </div>
            <h1 class="font-headline-md text-headline-md text-on-surface">InstaADB Panel</h1>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">Sistem Otomatisasi Konten &amp;
                Pertumbuhan</p>
        </div>
        <!-- Login Card -->
        <div
            class="bg-white dark:bg-surface-container-lowest p-8 md:p-10 rounded-2xl login-card border border-outline-variant/30">
            <form action="#" class="space-y-stack-lg" method="POST">
                <!-- Error Alert -->
                <div id="error-alert"
                    class="hidden bg-error-container text-on-error-container p-4 rounded-xl text-body-md flex items-center gap-2 border border-error/20">
                    <span class="material-symbols-outlined text-error text-md">error</span>
                    <span id="error-message">Username atau password salah!</span>
                </div>
                <!-- Username/Email Field -->
                <div class="space-y-2">
                    <label class="font-label-md text-label-md text-on-surface-variant block" for="identity">USERNAME
                        ATAU EMAIL</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined" data-icon="person">person</span>
                        </div>
                        <input
                            class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary transition-all placeholder:text-outline/50"
                            id="identity" name="identity" placeholder="nama@email.com" required="" type="text" />
                    </div>
                </div>
                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="font-label-md text-label-md text-on-surface-variant" for="password">KATA
                            SANDI</label>
                        <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Lupa Sandi?</a>
                    </div>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined" data-icon="lock">lock</span>
                        </div>
                        <input
                            class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant bg-surface-bright font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary transition-all placeholder:text-outline/50"
                            id="password" name="password" placeholder="••••••••" required="" type="password" />
                        <button
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors"
                            onclick="togglePassword()" type="button">
                            <span class="material-symbols-outlined" data-icon="visibility"
                                id="eye-icon">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Remember Me -->
                <div class="flex items-center">
                    <input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember"
                        name="remember" type="checkbox" />
                    <label class="ml-2 font-body-md text-body-md text-on-surface-variant select-none"
                        for="remember">Ingat perangkat ini</label>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full py-4 bg-primary-container hover:bg-primary text-white font-title-md text-title-md rounded-xl shadow-md shadow-primary-container/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                    type="submit">
                    <span>Masuk ke Dashboard</span>
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </form>
            <!-- Secondary Action -->
            <div class="mt-8 pt-6 border-t border-outline-variant/20 text-center">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    Belum memiliki akses?
                    <a class="text-primary font-semibold hover:underline" href="#">Hubungi Admin</a>
                </p>
            </div>
        </div>
        <!-- System Status Footer -->
        <div class="mt-stack-lg flex items-center justify-center gap-4 text-on-surface-variant font-label-md">
            <div class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-secondary-fixed-dim animate-pulse"></span>
                <span>System Online</span>
            </div>
            <span class="text-outline-variant">•</span>
            <span>v2.4.0-stable</span>
        </div>
    </main>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Add a subtle parallax effect to the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.login-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Form handling with API connection
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const alertBox = document.getElementById('error-alert');
            const alertMsg = document.getElementById('error-message');

            // Hide previous errors
            alertBox.classList.add('hidden');

            const origContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Memproses...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            const identity = document.getElementById('identity').value.trim();
            const password = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('username', identity);
            formData.append('password', password);

            fetch('http://127.0.0.1:8000/api/login', {
                method: 'POST',
                body: formData
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Gagal menghubungkan ke server.');
                    }
                    return res.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        // Save token and profile to localStorage
                        localStorage.setItem('admin_token', data.token);
                        localStorage.setItem('admin_profile', JSON.stringify({
                            name: data.user.name,
                            role: data.user.role,
                            avatar: data.user.avatar,
                            username: data.user.username
                        }));

                        // Show success state on button
                        btn.innerHTML = '<span class="material-symbols-outlined text-white text-md">check_circle</span> Sukses!';
                        btn.classList.remove('bg-primary-container', 'hover:bg-primary');
                        btn.classList.add('bg-secondary', 'text-white');

                        setTimeout(() => {
                            window.location.href = "logs.html";
                        }, 800);
                    } else {
                        // Show validation error
                        alertMsg.textContent = data.message || 'Username atau password salah!';
                        alertBox.classList.remove('hidden');

                        // Reset button
                        btn.innerHTML = origContent;
                        btn.classList.remove('opacity-80', 'cursor-not-allowed');
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    alertMsg.textContent = 'Gagal menghubungkan ke server API backend. Pastikan server aktif!';
                    alertBox.classList.remove('hidden');

                    // Reset button
                    btn.innerHTML = origContent;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    btn.disabled = false;
                });
        });
    </script>
</body>

</html>
